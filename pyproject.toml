[project]
name = "terrain-stl-notebook"
version = "0.1.0"
description = "Read zipped Norwegian GeoTIFF DTM tiles, validate actual spatial resolution, and export 3D-printable STL"
requires-python = ">=3.11"
dependencies = [
 "numpy>=1.26,<3",
 "rasterio>=1.3.10,<2",
 "scipy>=1.12,<2",
 "trimesh>=4.0,<5",
 "matplotlib>=3.8,<4",
 "plotly>=5.24,<7",
 "pandas>=2.1,<3",
 "geopandas>=1.0,<2",
 "pyogrio>=0.12,<1",
 "shapely>=2.0,<3",
 "jupyterlab>=4.0,<5",
 "ipykernel>=6.0,<8",
 "networkx>=3.6.1",
]
